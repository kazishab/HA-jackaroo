<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Jackaroo - 3D Premium Marble Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 95vmin;
            height: 95vmin;
            max-width: 900px;
            max-height: 900px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 6px solid #D4AF37;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(212,175,55,0.7), inset 0 0 50px rgba(0,0,0,0.9);
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #D4AF37;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 20px #D4AF37;
            z-index: 10;
            letter-spacing: 2px;
        }

        #score {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #D4AF37;
            font-size: 14px;
            text-shadow: 0 0 20px #D4AF37;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #D4AF37;
            font-size: 12px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border: 1px solid #D4AF37;
            border-radius: 5px;
            text-shadow: 0 0 10px #D4AF37;
            z-index: 10;
        }

        #footer {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #D4AF37;
            font-size: 10px;
            text-align: center;
            text-shadow: 0 0 10px #D4AF37;
            z-index: 10;
            line-height: 1.4;
        }

        .btn {
            position: absolute;
            background: rgba(212,175,55,0.2);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 10;
        }

        .btn:hover {
            background: rgba(212,175,55,0.4);
            transform: scale(1.05);
        }

        #resetBtn {
            bottom: 20px;
            right: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">HA Jackaroo</div>
        <div id="score">Score: <span id="scoreValue">0</span></div>
        <div id="instructions">Click marble to select • Click hole to move</div>
        <button class="btn" id="resetBtn" onclick="game.reset()">🔄 Reset</button>
        <div id="footer">
            Build by <strong>HA Tech BD</strong><br>
            © 2024 HA Jackaroo. All rights reserved.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            if (game) game.render();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============================================
        // GAME ENGINE
        // ============================================

        class JackarooGame {
            constructor() {
                this.BOARD_SIZE = 7;
                this.SPACING = canvas.width / 10;
                this.OFFSET_X = (canvas.width - this.SPACING * 6) / 2;
                this.OFFSET_Y = (canvas.height - this.SPACING * 6) / 2;
                this.MARBLE_RADIUS = this.SPACING * 0.32;

                this.board = [];
                this.score = 0;
                this.selectedMarble = null;
                this.validMoves = [];
                this.marbles = [];
                this.gameActive = true;

                this.colors = {
                    gold: '#D4AF37',
                    yellow: '#FFD700',
                    green: '#00DD00',
                    blue: '#4169E1',
                    red: '#FF5733'
                };

                this.init();
            }

            init() {
                this.board = [];
                this.marbles = [];
                this.score = 0;
                this.selectedMarble = null;
                this.gameActive = true;

                // Create board layout
                for (let row = 0; row < this.BOARD_SIZE; row++) {
                    this.board[row] = [];
                    for (let col = 0; col < this.BOARD_SIZE; col++) {
                        const isValid = (row < 2 || row > 4) ? (col >= 2 && col <= 4) : true;
                        
                        if (isValid) {
                            if (row === 3 && col === 3) {
                                this.board[row][col] = 0;
                            } else {
                                this.board[row][col] = 1;
                                
                                // Assign colors by zone
                                let color = this.colors.gold;
                                if (col <= 2 && row >= 2 && row <= 4) {
                                    color = this.colors.yellow;
                                } else if (col >= 4 && row >= 2 && row <= 4) {
                                    color = this.colors.blue;
                                } else if (row <= 2 && col >= 2 && col <= 4) {
                                    color = this.colors.green;
                                } else if (row >= 4 && col >= 2 && col <= 4) {
                                    color = this.colors.red;
                                }

                                const x = this.OFFSET_X + col * this.SPACING;
                                const y = this.OFFSET_Y + row * this.SPACING;
                                this.marbles.push({ x, y, row, col, color, selected: false });
                            }
                        } else {
                            this.board[row][col] = -1;
                        }
                    }
                }

                this.render();
            }

            render() {
                // Clear canvas
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw jungle background
                this.drawJungleBackground();

                // Draw game area background
                ctx.fillStyle = 'rgba(30, 20, 10, 0.6)';
                const boardWidth = this.SPACING * 6;
                const boardHeight = this.SPACING * 6;
                ctx.fillRect(
                    this.OFFSET_X - this.SPACING * 0.5,
                    this.OFFSET_Y - this.SPACING * 0.5,
                    boardWidth + this.SPACING,
                    boardHeight + this.SPACING
                );

                // Draw board border
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    this.OFFSET_X - this.SPACING * 0.5,
                    this.OFFSET_Y - this.SPACING * 0.5,
                    boardWidth + this.SPACING,
                    boardHeight + this.SPACING
                );

                // Draw holes
                for (let row = 0; row < this.BOARD_SIZE; row++) {
                    for (let col = 0; col < this.BOARD_SIZE; col++) {
                        if (this.board[row][col] !== -1) {
                            const x = this.OFFSET_X + col * this.SPACING;
                            const y = this.OFFSET_Y + row * this.SPACING;
                            this.drawHole(x, y);
                        }
                    }
                }

                // Draw marbles
                this.marbles.forEach(marble => {
                    if (this.board[marble.row][marble.col] === 1) {
                        this.drawMarble(marble);
                    }
                });

                // Draw jungle decorations
                this.drawJungleDecorations();
            }

            drawJungleBackground() {
                // Sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, 'rgba(50, 80, 40, 0.3)');
                skyGradient.addColorStop(1, 'rgba(20, 20, 20, 0.8)');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Tree trunks
                for (let i = 0; i < 4; i++) {
                    ctx.fillStyle = 'rgba(100, 60, 20, 0.4)';
                    ctx.fillRect(
                        canvas.width * (0.15 + i * 0.25),
                        0,
                        canvas.width * 0.08,
                        canvas.height * 0.4
                    );
                }

                // Vines
                for (let i = 0; i < 6; i++) {
                    ctx.strokeStyle = 'rgba(80, 100, 60, 0.2)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width * (0.1 + i * 0.15), 0);
                    for (let y = 0; y < canvas.height * 0.8; y += 30) {
                        ctx.lineTo(canvas.width * (0.12 + i * 0.15 + Math.sin(y / 20) * 0.05), y);
                    }
                    ctx.stroke();
                }
            }

            drawHole(x, y) {
                // Hole shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(x, y, this.MARBLE_RADIUS * 0.85, 0, Math.PI * 2);
                ctx.fill();

                // Hole border
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x, y, this.MARBLE_RADIUS * 0.85, 0, Math.PI * 2);
                ctx.stroke();
            }

            drawMarble(marble) {
                const { x, y, color, selected } = marble;

                // 3D sphere gradient
                const gradient = ctx.createRadialGradient(
                    x - this.MARBLE_RADIUS * 0.3,
                    y - this.MARBLE_RADIUS * 0.3,
                    0,
                    x,
                    y,
                    this.MARBLE_RADIUS
                );

                gradient.addColorStop(0, this.adjustBrightness(color, 1.3));
                gradient.addColorStop(0.5, color);
                gradient.addColorStop(1, this.adjustBrightness(color, 0.5));

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, this.MARBLE_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // Shine effect
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(
                    x - this.MARBLE_RADIUS * 0.4,
                    y - this.MARBLE_RADIUS * 0.4,
                    this.MARBLE_RADIUS * 0.25,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, this.MARBLE_RADIUS, 0, Math.PI * 2);
                ctx.stroke();

                ctx.shadowColor = 'transparent';

                // Selection highlight
                if (selected) {
                    ctx.strokeStyle = '#FFE4B5';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(x, y, this.MARBLE_RADIUS + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            drawJungleDecorations() {
                // Masks (left side)
                this.drawMask(canvas.width * 0.08, canvas.height * 0.3, canvas.height * 0.08);
                this.drawMask(canvas.width * 0.08, canvas.height * 0.5, canvas.height * 0.08);

                // Mask (right side)
                this.drawMask(canvas.width * 0.92, canvas.height * 0.35, canvas.height * 0.08);
                this.drawMask(canvas.width * 0.92, canvas.height * 0.55, canvas.height * 0.08);

                // Drum
                this.drawDrum(canvas.width * 0.5, canvas.height * 0.15, canvas.height * 0.12);

                // Bananas
                this.drawBananas(canvas.width * 0.85, canvas.height * 0.65, canvas.height * 0.06);

                // Lantern
                this.drawLantern(canvas.width * 0.12, canvas.height * 0.75, canvas.height * 0.08);
            }

            drawMask(x, y, size) {
                // Face shape
                ctx.fillStyle = 'rgba(180, 140, 80, 0.6)';
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'rgba(0, 200, 0, 0.7)';
                ctx.beginPath();
                ctx.arc(x - size * 0.2, y - size * 0.15, size * 0.12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + size * 0.2, y - size * 0.15, size * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                ctx.strokeStyle = 'rgba(200, 100, 0, 0.6)';
                ctx.lineWidth = size * 0.08;
                ctx.beginPath();
                ctx.arc(x, y + size * 0.1, size * 0.15, 0, Math.PI);
                ctx.stroke();
            }

            drawDrum(x, y, size) {
                // Drum body
                ctx.fillStyle = 'rgba(180, 140, 80, 0.5)';
                ctx.beginPath();
                ctx.ellipse(x, y + size * 0.3, size * 0.6, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Drum top
                ctx.fillStyle = 'rgba(220, 180, 120, 0.6)';
                ctx.beginPath();
                ctx.ellipse(x, y, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Drum shine
                ctx.fillStyle = 'rgba(255, 200, 100, 0.3)';
                ctx.beginPath();
                ctx.ellipse(x - size * 0.2, y - size * 0.15, size * 0.3, size * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            drawBananas(x, y, size) {
                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = 'rgba(255, 200, 50, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(x + i * size * 0.4, y - i * size * 0.2, size * 0.3, size * 0.15, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            drawLantern(x, y, size) {
                // Frame
                ctx.strokeStyle = 'rgba(150, 100, 50, 0.6)';
                ctx.lineWidth = size * 0.1;
                ctx.strokeRect(x - size * 0.3, y - size * 0.4, size * 0.6, size * 0.8);

                // Light
                ctx.fillStyle = 'rgba(255, 200, 0, 0.4)';
                ctx.beginPath();
                ctx.arc(x, y, size * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }

            adjustBrightness(color, factor) {
                const hex = color.replace('#', '');
                const r = Math.min(255, Math.floor(parseInt(hex.slice(0, 2), 16) * factor));
                const g = Math.min(255, Math.floor(parseInt(hex.slice(2, 4), 16) * factor));
                const b = Math.min(255, Math.floor(parseInt(hex.slice(4, 6), 16) * factor));
                return `rgb(${r},${g},${b})`;
            }

            selectMarble(x, y) {
                for (const marble of this.marbles) {
                    if (this.board[marble.row][marble.col] === 1) {
                        const dx = x - marble.x;
                        const dy = y - marble.y;
                        if (Math.sqrt(dx * dx + dy * dy) <= this.MARBLE_RADIUS) {
                            this.selectedMarble = marble;
                            marble.selected = true;
                            this.validMoves = this.getValidMoves(marble.row, marble.col);
                            this.render();
                            return;
                        }
                    }
                }
            }

            getValidMoves(row, col) {
                const moves = [];
                const directions = [[-2, 0], [2, 0], [0, -2], [0, 2]];

                for (const [dr, dc] of directions) {
                    const nr = row + dr;
                    const nc = col + dc;
                    const mr = row + dr / 2;
                    const mc = col + dc / 2;

                    if (nr >= 0 && nr < this.BOARD_SIZE && nc >= 0 && nc < this.BOARD_SIZE) {
                        if (this.board[nr][nc] === 1 && this.board[mr][mc] === 1) {
                            moves.push({ row: nr, col: nc, captureRow: mr, captureCol: mc });
                        }
                    }
                }

                return moves;
            }

            moveMarble(x, y) {
                if (!this.selectedMarble) return;

                const { OFFSET_X, OFFSET_Y, SPACING, BOARD_SIZE } = this;
                let targetRow = -1, targetCol = -1;

                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        if (this.board[row][col] !== -1) {
                            const hx = OFFSET_X + col * SPACING;
                            const hy = OFFSET_Y + row * SPACING;
                            const dx = x - hx;
                            const dy = y - hy;
                            if (Math.sqrt(dx * dx + dy * dy) <= this.MARBLE_RADIUS * 0.9) {
                                targetRow = row;
                                targetCol = col;
                            }
                        }
                    }
                }

                if (targetRow === -1) return;

                const move = this.validMoves.find(m => m.row === targetRow && m.col === targetCol);
                if (!move) return;

                const { row, col } = this.selectedMarble;

                // Update board
                this.board[row][col] = 1;
                this.board[targetRow][targetCol] = 1;
                this.board[move.captureRow][move.captureCol] = 0;

                // Move marble
                this.selectedMarble.row = targetRow;
                this.selectedMarble.col = targetCol;
                this.selectedMarble.x = OFFSET_X + targetCol * SPACING;
                this.selectedMarble.y = OFFSET_Y + targetRow * SPACING;
                this.selectedMarble.selected = false;

                // Remove captured marble
                this.marbles = this.marbles.filter(m => !(m.row === move.captureRow && m.col === move.captureCol));

                this.score += 10;
                this.selectedMarble = null;
                this.validMoves = [];

                document.getElementById('scoreValue').textContent = this.score;
                this.render();

                const remaining = this.marbles.filter(m => this.board[m.row][m.col] === 1).length;
                if (remaining === 1) {
                    setTimeout(() => alert(`🎉 You Won!\nFinal Score: ${this.score}`), 300);
                    this.gameActive = false;
                }
            }

            reset() {
                this.init();
            }
        }

        let game = new JackarooGame();

        // Event listeners
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (game.selectedMarble) {
                game.moveMarble(x, y);
            } else {
                game.selectMarble(x, y);
            }
        });

        // Start animation loop
        function animate() {
            game.render();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
